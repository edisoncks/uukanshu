[project]
name = "uukanshu"
version = "0.1.0"
description = "Read novels from uukanshu.cc in your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "OpenCC",
    "textual >=0.86",
]

[project.scripts]
uukanshu = "uukanshu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uukanshu"]
