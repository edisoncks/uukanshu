[project]
name = "uukanshu"
description = "Read novels from uukanshu.cc in your terminal"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "OpenCC",
    "certifi",
    "textual >=0.86",
]

[project.scripts]
uukanshu = "uukanshu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/uukanshu/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uukanshu"]
